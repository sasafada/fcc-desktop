<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>FCC AI</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar" aria-label="Menu lateral">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
        </div>
        <span class="brand-name">FCC AI</span>
      </div>
    </div>

    <nav class="sidebar-nav" role="navigation" aria-label="Navegação principal">
      <section class="sidebar-section" aria-label="Ações">
        <h3 class="sidebar-section-title">Ações</h3>
        <button class="sidebar-item" data-act="newChat" type="button">
          <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
          <span>Novo chat</span>
        </button>
        <button class="sidebar-item" data-act="projects" type="button">
          <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Projetos</span>
        </button>
        <button class="sidebar-item" data-act="skills" type="button">
          <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Skills</span>
        </button>
        <button class="sidebar-item" data-act="plugins" type="button">
          <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Plugins</span>
        </button>
      </section>

      <div class="sidebar-divider"></div>

      <section class="sidebar-section" aria-label="Conversas recentes">
        <h3 class="sidebar-section-title">Recentes</h3>
        <div id="recent-list" class="recent-list" role="list"></div>
      </section>

      <div class="sidebar-divider"></div>

      <section class="sidebar-footer" aria-label="Opções do usuário">
        <button class="sidebar-item sidebar-item-danger" data-act="exit" type="button">
          <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
          <span>Sair</span>
        </button>
        <button class="sidebar-item sidebar-user" id="user-btn" type="button" aria-label="Configurações do usuário">
          <div class="user-avatar">U</div>
          <span>Conta</span>
          <svg class="sidebar-item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </section>
    </nav>
  </aside>

  <!-- Main Content -->
  <main id="main" class="main">
    <!-- Top Bar -->
    <header class="topbar" role="banner">
      <button class="btn-icon sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="topbar-title">Conversa</h1>
      <div class="topbar-actions">
        <button class="btn-icon" id="user-menu-btn" aria-label="Menu do usuário" type="button">
          <div class="user-avatar-sm">U</div>
        </button>
      </div>
    </header>

    <!-- Chat View -->
    <section id="chat-view" class="chat-view" role="main" aria-label="Conversa">
      <!-- Empty State - Animated AI Icon -->
      <div id="empty-state" class="empty-state" aria-hidden="true">
        <div class="ai-icon-wrapper">
          <div class="ai-icon" id="ai-icon">
            <!-- Animated AI mascot -->
            <div class="ai-body">
              <div class="ai-head">
                <div class="ai-eyes">
                  <div class="ai-eye left"><div class="ai-pupil"></div></div>
                  <div class="ai-eye right"><div class="ai-pupil"></div></div>
                </div>
                <div class="ai-antenna"><div class="ai-antenna-tip"></div></div>
              </div>
              <div class="ai-body-main">
                <div class="ai-arm left"></div>
                <div class="ai-arm right"></div>
              </div>
              <div class="ai-legs">
                <div class="ai-leg left"></div>
                <div class="ai-leg right"></div>
              </div>
              <div class="ai-glow"></div>
            </div>
            <div class="ai-particles" id="ai-particles"></div>
          </div>
        </div>
        <h2 class="empty-title">FCC AI</h2>
        <p class="empty-subtitle">Digite sua mensagem para começar</p>
      </div>

      <!-- Messages Container -->
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Mensagens da conversa"></div>
    </section>

    <!-- Composer -->
    <footer class="composer" role="form" aria-label="Enviar mensagem">
      <div id="attachments-row" class="attachments-row" aria-label="Anexos"></div>
      <div class="composer-box">
        <button class="btn-icon attach-btn" id="attach-btn" aria-label="Anexar arquivo" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Digite sua mensagem aqui…" aria-label="Digite sua mensagem" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
        <button class="btn-icon send-btn" id="send-btn" aria-label="Enviar mensagem" type="button">
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <!-- User Menu Dropdown -->
  <div id="user-menu" class="dropdown" role="menu" aria-label="Menu do usuário">
    <button class="dropdown-item" role="menuitem" data-act="personalize" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
      <span>Personalizar ambiente</span>
    </button>
    <button class="dropdown-item" role="menuitem" data-act="providers" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      <span>Provedores de IA</span>
    </button>
    <button class="dropdown-item dropdown-item-danger" role="menuitem" data-act="exit" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
      <span>Sair</span>
    </button>
  </div>

  <!-- User Menu Trigger (for mobile) -->
  <button class="btn-icon user-menu-trigger" id="user-menu-trigger" aria-label="Menu do usuário" type="button">
    <div class="user-avatar-sm">U</div>
  </button>

  <!-- Bottom Sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" aria-hidden="true"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab"></div>
    <header class="sheet-header">
      <h3 id="sheet-title"></h3>
      <button class="btn-icon sheet-close" aria-label="Fechar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
    <footer id="sheet-actions" class="sheet-actions"></footer>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Busy Overlay -->
  <div id="busy-overlay" class="busy-overlay" aria-live="assertive" aria-atomic="true" hidden>
    <div class="busy-card">
      <div class="busy-icon">
        <div class="spinner"></div>
      </div>
      <h3 id="busy-title">Preparando</h3>
      <p id="busy-text"></p>
      <div class="busy-progress">
        <div class="busy-bar" id="busy-bar"></div>
      </div>
      <span id="busy-pct"></span>
      <button class="btn btn-primary btn-block" id="busy-retry" type="button" hidden>Tentar novamente</button>
    </div>
  </div>
</div>

<!-- Vendor Scripts -->
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
