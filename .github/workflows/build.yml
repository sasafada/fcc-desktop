name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Configurar emulação ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma Android 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validar compilação Kotlin
        run: gradle --no-daemon :app:compileReleaseKotlin

      - name: Preparar proot e rootfs (FCC + Claude Code)
        run: bash scripts/prepare_assets.sh

      - name: Verificar arquivos ARM64 e rootfs
        run: |
          test -s app/src/main/assets/rootfs.tar.gz
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -s app/src/main/jniLibs/arm64-v8a/libtalloc.so
          test -s app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          ls -lh app/src/main/assets/rootfs.tar.gz
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Compilar APK
        run: gradle --no-daemon assembleRelease

      - name: Verificar APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK GERADO: $APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: fcc-claude-apk
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          retention-days: 14
