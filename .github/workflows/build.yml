name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Cache do Linux embutido (proot + rootfs)
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/rootfs.tar.gz
            app/src/main/jniLibs
          key: assets-${{ hashFiles('scripts/prepare_assets.sh') }}

      - name: Preparar proot e rootfs (FCC + Claude Code)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/prepare_assets.sh

      - name: Remover rootfs temporário (arquivos root)
        if: always()
        run: sudo rm -rf .work

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restaurar chave de assinatura
        env:
          FCC_KEYSTORE_BASE64: ${{ secrets.FCC_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FCC_KEYSTORE_BASE64"
          printf '%s' "$FCC_KEYSTORE_BASE64" | base64 --decode > fcc.p12
          test -s fcc.p12
          chmod 600 fcc.p12

      - name: Compilar APK
        env:
          FCC_STORE_PASSWORD: ${{ secrets.FCC_STORE_PASSWORD }}
          FCC_KEY_PASSWORD: ${{ secrets.FCC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FCC_STORE_PASSWORD"
          test -n "$FCC_KEY_PASSWORD"
          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: fcc-claude-apk
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          retention-days: 14
